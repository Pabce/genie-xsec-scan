# Identical inclusive electron kinematics for C12 and Fe56.

[global]
mode = tune
tune = GEM21_11a_00_000
event-generator-list = EM
probe = 11
observable = d2
diff = Eprime,costheta_l
xsec-unit = nb
components = true
fold = auto
jobs = 1
initial-state-fold-samples = 512
initial-state-fold-nr = 12
initial-state-fold-np = 64
shape-norm = empirical-mec
output = out/batch/c12_fe56_e056_th60_gem21.csv

[scan C12_E056_th60]
target = 1000060120
fixed = E=0.56
fixed = costheta_l=0.5
range = Eprime:0.555:0.105:96

[scan Fe56_E056_th60]
target = 1000260560
fixed = E=0.56
fixed = costheta_l=0.5
range = Eprime:0.555:0.105:96
