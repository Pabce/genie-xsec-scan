# Three C12 inclusive electron-scattering panels in one scanner process.
# CLI options supplied with --batch-config override scalar values below.

[global]
mode = tune
tune = GEM21_11a_00_000
event-generator-list = EM
probe = 11
target = 1000060120
observable = d2
diff = Eprime,costheta_l
xsec-unit = nb
components = true
fold = auto
jobs = 1
initial-state-fold-samples = 512
initial-state-fold-nr = 12
initial-state-fold-np = 64
shape-norm = empirical-mec
output = out/batch/c12_fig6_gem21.csv

[scan E024_th60]
fixed = E=0.24
fixed = costheta_l=0.5
range = Eprime:0.235:0.125:64

[scan E056_th36]
fixed = E=0.56
fixed = costheta_l=0.809016994375
range = Eprime:0.555:0.155:92

[scan E056_th60]
fixed = E=0.56
fixed = costheta_l=0.5
range = Eprime:0.555:0.105:96
